<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, keyboard-friendly calculator." />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="brand" aria-label="Product name">
        <span class="brand-mark" aria-hidden="true">=</span>
        <span>Simple Calc</span>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite" aria-atomic="true">
          <p class="expression" id="expression">&nbsp;</p>
          <output class="result" id="result">0</output>
        </div>

        <div class="keypad">
          <button class="key key--utility" data-action="clear">AC</button>
          <button class="key key--utility" data-action="sign" aria-label="Toggle positive or negative">+/−</button>
          <button class="key key--utility" data-action="percent" aria-label="Percent">%</button>
          <button class="key key--operator" data-operator="/" aria-label="Divide">÷</button>

          <button class="key" data-number="7">7</button>
          <button class="key" data-number="8">8</button>
          <button class="key" data-number="9">9</button>
          <button class="key key--operator" data-operator="*" aria-label="Multiply">×</button>

          <button class="key" data-number="4">4</button>
          <button class="key" data-number="5">5</button>
          <button class="key" data-number="6">6</button>
          <button class="key key--operator" data-operator="-" aria-label="Subtract">−</button>

          <button class="key" data-number="1">1</button>
          <button class="key" data-number="2">2</button>
          <button class="key" data-number="3">3</button>
          <button class="key key--operator" data-operator="+" aria-label="Add">+</button>

          <button class="key key--zero" data-number="0">0</button>
          <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>

      <p class="keyboard-hint"><span aria-hidden="true">⌨</span> Keyboard enabled</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
